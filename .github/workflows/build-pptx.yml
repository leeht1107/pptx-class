name: Build PPTX

on:
  # slides/ 폴더에 push할 때마다 자동 빌드
  push:
    branches: [main]
    paths:
      - "slides/**"
      - "fixtures/**"
      - "lib/**"
  # 수동 실행: Actions 탭 → Run workflow → slides 폴더 지정 가능
  workflow_dispatch:
    inputs:
      slides_dir:
        description: "슬라이드 폴더 (예: slides, fixtures/10min-presentation)"
        required: false
        default: "slides"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Resolve slides directory
        id: resolve
        env:
          INPUT_DIR: ${{ github.event.inputs.slides_dir || 'slides' }}
        run: |
          DIR="$INPUT_DIR"
          # slides/ 없으면 10min-presentation fixture로 fallback
          if [ ! -d "$DIR" ] || [ -z "$(ls "$DIR"/*.mjs 2>/dev/null)" ]; then
            echo "⚠️  '$DIR' 에 slide-NN.mjs 없음 → fixtures/10min-presentation 사용"
            DIR="fixtures/10min-presentation"
          fi
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Build PPTX
        env:
          SLIDES_DIR: ${{ steps.resolve.outputs.dir }}
        run: node scripts/build.mjs --slides-dir "$SLIDES_DIR" --out output.pptx

      - name: Upload PPTX artifact
        uses: actions/upload-artifact@v4
        with:
          name: presentation-${{ github.run_number }}
          path: output.pptx
          retention-days: 14
